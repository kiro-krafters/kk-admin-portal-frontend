<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kiro Insurance — AI Contact Center</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #0f1e3c;
      --navy-mid: #162952;
      --navy-light: #1e3a6e;
      --blue: #1d5fcd;
      --blue-light: #3b82f6;
      --cyan: #06b6d4;
      --teal: #0ea5e9;
      --gold: #f59e0b;
      --green: #10b981;
      --red: #ef4444;
      --orange: #f97316;
      --white: #ffffff;
      --gray-50: #f8fafc;
      --gray-100: #f1f5f9;
      --gray-200: #e2e8f0;
      --gray-300: #cbd5e1;
      --gray-400: #94a3b8;
      --gray-500: #64748b;
      --gray-600: #475569;
      --gray-700: #334155;
      --gray-800: #1e293b;
      --gray-900: #0f172a;
    }
    body { font-family: 'Inter', sans-serif; background: var(--gray-50); color: var(--gray-800); line-height: 1.5; }
    button { cursor: pointer; font-family: inherit; }
    input, select { font-family: inherit; }

    /* ── GLOBAL APP SHELL ── */
    .app-shell { min-height: 100vh; display: flex; flex-direction: column; }

    /* ── APP SELECTOR TABS ── */
    .app-switcher { background: var(--navy); padding: 0; display: flex; align-items: center; border-bottom: 2px solid var(--navy-light); position: sticky; top: 0; z-index: 1000; }
    .switcher-brand { display: flex; align-items: center; gap: 10px; padding: 0 24px; border-right: 1px solid rgba(255,255,255,0.1); height: 52px; }
    .brand-icon { width: 32px; height: 32px; background: linear-gradient(135deg, var(--cyan), var(--blue)); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .brand-name { color: white; font-weight: 700; font-size: 15px; letter-spacing: -0.3px; }
    .brand-tag { color: var(--cyan); font-size: 11px; font-weight: 500; }
    .switcher-tabs { display: flex; gap: 0; padding: 0 8px; }
    .sw-tab { color: rgba(255,255,255,0.6); font-size: 13px; font-weight: 500; padding: 0 18px; height: 52px; display: flex; align-items: center; gap: 8px; border: none; background: none; transition: all 0.2s; border-bottom: 3px solid transparent; cursor: pointer; }
    .sw-tab:hover { color: white; background: rgba(255,255,255,0.05); }
    .sw-tab.active { color: var(--cyan); border-bottom-color: var(--cyan); background: rgba(6,182,212,0.08); }
    .sw-tab .tab-icon { font-size: 16px; }
    .sw-badge { background: var(--red); color: white; font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 10px; }

    /* ══════════════════════════════════
       VIEW 1: CUSTOMER PORTAL
    ══════════════════════════════════ */
    .portal-header { background: var(--navy); }
    .portal-topbar { display: flex; align-items: center; justify-content: space-between; padding: 0 40px; height: 70px; max-width: 1280px; margin: 0 auto; width: 100%; }
    .portal-logo { display: flex; align-items: center; gap: 12px; }
    .portal-logo-icon { width: 44px; height: 44px; background: linear-gradient(135deg, var(--cyan) 0%, var(--blue) 100%); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
    .portal-logo-text { color: white; }
    .portal-logo-text .name { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; }
    .portal-logo-text .sub { font-size: 11px; color: var(--cyan); font-weight: 500; letter-spacing: 1px; text-transform: uppercase; }
    .portal-nav { display: flex; align-items: center; gap: 6px; }
    .portal-nav a { color: rgba(255,255,255,0.75); font-size: 14px; font-weight: 500; padding: 8px 14px; border-radius: 6px; text-decoration: none; transition: all 0.2s; }
    .portal-nav a:hover { color: white; background: rgba(255,255,255,0.1); }
    .portal-nav a.active { color: white; background: rgba(6,182,212,0.2); }
    .portal-nav-cta { background: var(--cyan); color: var(--navy) !important; font-weight: 700 !important; padding: 8px 18px !important; border-radius: 8px !important; }
    .portal-nav-cta:hover { background: #22d3ee !important; }

    .portal-hero { background: linear-gradient(160deg, var(--navy) 0%, var(--navy-light) 50%, #1a4a8a 100%); padding: 80px 40px 100px; position: relative; overflow: hidden; }
    .portal-hero::before { content: ''; position: absolute; top: -50%; right: -10%; width: 600px; height: 600px; background: radial-gradient(circle, rgba(6,182,212,0.12) 0%, transparent 70%); pointer-events: none; }
    .portal-hero::after { content: ''; position: absolute; bottom: -20%; left: 5%; width: 400px; height: 400px; background: radial-gradient(circle, rgba(29,95,205,0.15) 0%, transparent 70%); pointer-events: none; }
    .portal-hero-inner { max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: center; position: relative; z-index: 1; }
    .hero-label { display: inline-flex; align-items: center; gap: 6px; background: rgba(6,182,212,0.15); border: 1px solid rgba(6,182,212,0.3); color: var(--cyan); font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 20px; margin-bottom: 20px; letter-spacing: 0.5px; text-transform: uppercase; }
    .hero-title { font-size: 48px; font-weight: 800; color: white; line-height: 1.1; letter-spacing: -1px; margin-bottom: 20px; }
    .hero-title span { background: linear-gradient(135deg, var(--cyan), var(--teal)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .hero-desc { font-size: 17px; color: rgba(255,255,255,0.7); line-height: 1.7; margin-bottom: 32px; max-width: 480px; }
    .hero-actions { display: flex; gap: 12px; flex-wrap: wrap; }
    .btn-primary { background: linear-gradient(135deg, var(--cyan), var(--teal)); color: var(--navy); font-weight: 700; font-size: 15px; padding: 14px 28px; border-radius: 10px; border: none; transition: all 0.2s; box-shadow: 0 4px 20px rgba(6,182,212,0.4); }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 28px rgba(6,182,212,0.5); }
    .btn-outline { background: rgba(255,255,255,0.08); color: white; font-weight: 600; font-size: 15px; padding: 14px 28px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.2); transition: all 0.2s; }
    .btn-outline:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.4); }
    .hero-stats { display: flex; gap: 32px; margin-top: 40px; }
    .hero-stat { }
    .hero-stat .num { font-size: 28px; font-weight: 800; color: white; }
    .hero-stat .lbl { font-size: 12px; color: rgba(255,255,255,0.55); font-weight: 500; margin-top: 2px; }
    .hero-card { background: rgba(255,255,255,0.06); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.12); border-radius: 20px; padding: 28px; }
    .hc-header { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    .hc-status { width: 8px; height: 8px; background: var(--green); border-radius: 50%; box-shadow: 0 0 8px var(--green); }
    .hc-title { color: white; font-weight: 600; font-size: 15px; }
    .hc-subtitle { color: rgba(255,255,255,0.5); font-size: 12px; margin-left: auto; }
    .hc-chat-messages { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
    .chat-msg { display: flex; gap: 8px; }
    .chat-msg.user { flex-direction: row-reverse; }
    .chat-avatar { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
    .chat-avatar.bot { background: linear-gradient(135deg, var(--cyan), var(--blue)); color: white; }
    .chat-avatar.user { background: rgba(255,255,255,0.15); color: white; font-size: 11px; }
    .chat-bubble { max-width: 200px; padding: 10px 14px; border-radius: 14px; font-size: 13px; line-height: 1.5; }
    .chat-bubble.bot { background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.9); border-bottom-left-radius: 4px; }
    .chat-bubble.user { background: linear-gradient(135deg, var(--cyan), var(--teal)); color: var(--navy); font-weight: 500; border-bottom-right-radius: 4px; }
    .hc-input { display: flex; gap: 8px; }
    .hc-input input { flex: 1; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; padding: 10px 14px; color: white; font-size: 13px; outline: none; }
    .hc-input input::placeholder { color: rgba(255,255,255,0.35); }
    .hc-send { background: var(--cyan); border: none; border-radius: 8px; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; color: var(--navy); font-size: 16px; }

    .portal-features { padding: 80px 40px; max-width: 1280px; margin: 0 auto; }
    .section-label { font-size: 12px; font-weight: 700; color: var(--blue); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 10px; }
    .section-title { font-size: 36px; font-weight: 800; color: var(--gray-900); letter-spacing: -0.8px; margin-bottom: 14px; }
    .section-desc { font-size: 16px; color: var(--gray-500); max-width: 560px; }
    .features-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 48px; }
    .feature-card { background: white; border: 1px solid var(--gray-100); border-radius: 16px; padding: 28px; transition: all 0.2s; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
    .feature-card:hover { border-color: var(--blue-light); box-shadow: 0 8px 30px rgba(29,95,205,0.1); transform: translateY(-2px); }
    .feature-icon { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: 18px; }
    .feature-icon.blue { background: rgba(59,130,246,0.1); }
    .feature-icon.cyan { background: rgba(6,182,212,0.1); }
    .feature-icon.green { background: rgba(16,185,129,0.1); }
    .feature-icon.gold { background: rgba(245,158,11,0.1); }
    .feature-icon.red { background: rgba(239,68,68,0.08); }
    .feature-icon.purple { background: rgba(139,92,246,0.1); }
    .feature-title { font-size: 16px; font-weight: 700; color: var(--gray-900); margin-bottom: 8px; }
    .feature-desc { font-size: 14px; color: var(--gray-500); line-height: 1.6; }
    .feature-link { font-size: 13px; font-weight: 600; color: var(--blue); margin-top: 14px; display: inline-flex; align-items: center; gap: 4px; }

    .portal-plans { background: linear-gradient(180deg, white 0%, var(--gray-50) 100%); padding: 80px 40px; }
    .plans-inner { max-width: 1280px; margin: 0 auto; }
    .plans-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; margin-top: 48px; }
    .plan-card { background: white; border: 1px solid var(--gray-200); border-radius: 20px; padding: 32px; position: relative; }
    .plan-card.featured { border-color: var(--blue); box-shadow: 0 0 0 1px var(--blue), 0 20px 60px rgba(29,95,205,0.15); }
    .plan-badge { position: absolute; top: -13px; left: 50%; transform: translateX(-50%); background: var(--blue); color: white; font-size: 11px; font-weight: 700; padding: 4px 14px; border-radius: 20px; letter-spacing: 0.5px; text-transform: uppercase; }
    .plan-icon { font-size: 36px; margin-bottom: 16px; }
    .plan-name { font-size: 18px; font-weight: 800; color: var(--gray-900); margin-bottom: 6px; }
    .plan-price { font-size: 36px; font-weight: 800; color: var(--navy); margin-bottom: 4px; }
    .plan-price span { font-size: 16px; font-weight: 500; color: var(--gray-400); }
    .plan-desc { font-size: 13px; color: var(--gray-500); margin-bottom: 24px; padding-bottom: 24px; border-bottom: 1px solid var(--gray-100); }
    .plan-features { list-style: none; display: flex; flex-direction: column; gap: 10px; margin-bottom: 28px; }
    .plan-features li { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--gray-700); }
    .plan-features li::before { content: '✓'; color: var(--green); font-weight: 700; flex-shrink: 0; }
    .btn-plan { width: 100%; padding: 14px; border-radius: 10px; font-size: 15px; font-weight: 700; border: none; }
    .btn-plan.secondary { background: var(--gray-100); color: var(--gray-700); }
    .btn-plan.primary { background: var(--blue); color: white; box-shadow: 0 4px 20px rgba(29,95,205,0.3); }

    .portal-footer { background: var(--navy); padding: 60px 40px 32px; }
    .footer-inner { max-width: 1280px; margin: 0 auto; }
    .footer-grid { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 48px; margin-bottom: 40px; }
    .footer-brand .name { color: white; font-size: 20px; font-weight: 800; margin-bottom: 12px; }
    .footer-brand p { color: rgba(255,255,255,0.5); font-size: 14px; line-height: 1.7; }
    .footer-col h4 { color: white; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 16px; }
    .footer-col a { display: block; color: rgba(255,255,255,0.5); font-size: 14px; margin-bottom: 8px; text-decoration: none; transition: color 0.2s; }
    .footer-col a:hover { color: white; }
    .footer-bottom { border-top: 1px solid rgba(255,255,255,0.1); padding-top: 24px; display: flex; align-items: center; justify-content: space-between; }
    .footer-bottom p { color: rgba(255,255,255,0.4); font-size: 13px; }

    .chat-float-btn { position: fixed; bottom: 28px; right: 28px; width: 60px; height: 60px; border-radius: 50%; background: linear-gradient(135deg, var(--cyan), var(--blue)); border: none; color: white; font-size: 26px; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 30px rgba(6,182,212,0.5); z-index: 900; transition: all 0.3s; }
    .chat-float-btn:hover { transform: scale(1.1); }
    .chat-widget { position: fixed; bottom: 100px; right: 28px; width: 360px; background: white; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.2); z-index: 901; overflow: hidden; border: 1px solid var(--gray-200); }
    .cw-header { background: linear-gradient(135deg, var(--navy), var(--navy-light)); padding: 18px 20px; display: flex; align-items: center; gap: 12px; }
    .cw-avatar { width: 40px; height: 40px; background: linear-gradient(135deg, var(--cyan), var(--blue)); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .cw-info .name { color: white; font-size: 15px; font-weight: 700; }
    .cw-info .status { color: var(--cyan); font-size: 12px; display: flex; align-items: center; gap: 4px; }
    .cw-info .status::before { content: ''; width: 6px; height: 6px; background: var(--green); border-radius: 50%; }
    .cw-close { margin-left: auto; background: rgba(255,255,255,0.1); border: none; color: white; width: 28px; height: 28px; border-radius: 6px; font-size: 14px; display: flex; align-items: center; justify-content: center; }
    .cw-pre-form { padding: 24px; }
    .cw-pre-form h3 { font-size: 17px; font-weight: 700; color: var(--gray-900); margin-bottom: 6px; }
    .cw-pre-form p { font-size: 13px; color: var(--gray-500); margin-bottom: 20px; }
    .form-field { margin-bottom: 14px; }
    .form-field label { display: block; font-size: 12px; font-weight: 600; color: var(--gray-600); margin-bottom: 6px; }
    .form-field input { width: 100%; border: 1px solid var(--gray-200); border-radius: 8px; padding: 10px 14px; font-size: 14px; outline: none; transition: border-color 0.2s; color: var(--gray-800); }
    .form-field input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(29,95,205,0.08); }
    .form-field select { width: 100%; border: 1px solid var(--gray-200); border-radius: 8px; padding: 10px 14px; font-size: 14px; outline: none; color: var(--gray-800); background: white; }
    .btn-start-chat { width: 100%; background: linear-gradient(135deg, var(--blue), var(--navy-light)); color: white; font-size: 15px; font-weight: 700; padding: 14px; border-radius: 10px; border: none; margin-top: 4px; box-shadow: 0 4px 16px rgba(29,95,205,0.3); }
    .cw-messages { padding: 16px; min-height: 220px; display: flex; flex-direction: column; gap: 12px; background: var(--gray-50); }
    .cw-msg { display: flex; gap: 8px; }
    .cw-msg.user { flex-direction: row-reverse; }
    .cw-msg-bubble { max-width: 240px; padding: 10px 14px; border-radius: 14px; font-size: 13px; line-height: 1.5; }
    .cw-msg-bubble.bot { background: white; color: var(--gray-700); border: 1px solid var(--gray-200); border-bottom-left-radius: 4px; }
    .cw-msg-bubble.user { background: var(--blue); color: white; border-bottom-right-radius: 4px; }
    .cw-input-area { padding: 14px; border-top: 1px solid var(--gray-200); display: flex; gap: 8px; }
    .cw-input-area input { flex: 1; border: 1px solid var(--gray-200); border-radius: 8px; padding: 10px 14px; font-size: 14px; outline: none; }
    .cw-input-area input:focus { border-color: var(--blue); }
    .cw-send-btn { background: var(--blue); border: none; color: white; border-radius: 8px; width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; font-size: 16px; }

    /* ══════════════════════════════════
       VIEW 2: AGENT CCP
    ══════════════════════════════════ */
    .ccp-layout { display: flex; height: calc(100vh - 52px); background: var(--gray-900); }
    .ccp-sidebar { width: 280px; background: var(--navy); border-right: 1px solid rgba(255,255,255,0.08); display: flex; flex-direction: column; flex-shrink: 0; }
    .ccp-agent-profile { padding: 24px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .agent-avatar { width: 52px; height: 52px; background: linear-gradient(135deg, var(--cyan), var(--blue)); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 700; color: white; margin-bottom: 12px; }
    .agent-name { color: white; font-size: 15px; font-weight: 700; margin-bottom: 2px; }
    .agent-role { color: var(--cyan); font-size: 12px; font-weight: 500; margin-bottom: 14px; }
    .status-selector { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; padding: 8px 12px; color: white; font-size: 13px; font-weight: 500; width: 100%; display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .status-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .status-dot.available { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .status-dot.busy { background: var(--red); box-shadow: 0 0 6px var(--red); }
    .status-dot.break { background: var(--gold); box-shadow: 0 0 6px var(--gold); }
    .status-dot.offline { background: var(--gray-500); }
    .ccp-stats { padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .ccp-stat { background: rgba(255,255,255,0.04); border-radius: 8px; padding: 12px; }
    .ccp-stat .val { color: white; font-size: 22px; font-weight: 800; }
    .ccp-stat .lbl { color: rgba(255,255,255,0.45); font-size: 11px; margin-top: 2px; }
    .ccp-queue-list { padding: 16px 20px; flex: 1; overflow-y: auto; }
    .ccp-queue-list h4 { color: rgba(255,255,255,0.4); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
    .queue-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; margin-bottom: 4px; cursor: pointer; transition: background 0.15s; }
    .queue-item:hover { background: rgba(255,255,255,0.06); }
    .queue-item.active { background: rgba(6,182,212,0.12); border: 1px solid rgba(6,182,212,0.2); }
    .queue-item-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex-shrink: 0; }
    .queue-item-name { color: rgba(255,255,255,0.8); font-size: 13px; flex: 1; }
    .queue-item-count { color: var(--cyan); font-size: 12px; font-weight: 700; background: rgba(6,182,212,0.15); padding: 2px 7px; border-radius: 10px; }
    .ccp-main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .ccp-toolbar { background: var(--gray-800); border-bottom: 1px solid rgba(255,255,255,0.08); padding: 12px 24px; display: flex; align-items: center; gap: 12px; }
    .ccp-toolbar h2 { color: white; font-size: 15px; font-weight: 700; flex: 1; }
    .toolbar-btn { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); color: rgba(255,255,255,0.7); font-size: 13px; font-weight: 500; padding: 7px 14px; border-radius: 8px; display: flex; align-items: center; gap: 6px; transition: all 0.2s; }
    .toolbar-btn:hover { background: rgba(255,255,255,0.12); color: white; }
    .ccp-content { flex: 1; padding: 24px; overflow-y: auto; display: grid; grid-template-columns: 1fr 340px; gap: 20px; }
    .incoming-contact { background: var(--gray-800); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; overflow: hidden; }
    .ic-header { background: linear-gradient(135deg, rgba(29,95,205,0.4), rgba(6,182,212,0.2)); padding: 20px 24px; border-bottom: 1px solid rgba(255,255,255,0.1); }
    .ic-channel { display: inline-flex; align-items: center; gap: 6px; background: rgba(6,182,212,0.2); border: 1px solid rgba(6,182,212,0.3); color: var(--cyan); font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 14px; }
    .ic-customer-info { display: flex; align-items: center; gap: 16px; }

<script type="text/babel">
const { useState, useEffect, useRef } = React;

// ── helpers ──────────────────────────────────────────────────────
function useTimer(initial = 0) {
  const [t, setT] = useState(initial);
  useEffect(() => { const id = setInterval(() => setT(x => x + 1), 1000); return () => clearInterval(id); }, []);
  const fmt = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
  return fmt(t);
}
function useLiveMetrics() {
  const [m, setM] = useState({ ciq: 4, avail: 3, oldest: 142, sl: 84 });
  useEffect(() => {
    const id = setInterval(() => setM(p => ({
      ciq: Math.max(0, p.ciq + (Math.random()>0.5?1:-1)),
      avail: Math.max(0, Math.min(8, p.avail + (Math.random()>0.5?1:-1))),
      oldest: Math.max(0, p.oldest + Math.floor(Math.random()*20-8)),
      sl: Math.max(60, Math.min(100, p.sl + Math.floor(Math.random()*4-1))),
    })), 4000);
    return () => clearInterval(id);
  }, []);
  return m;
}
